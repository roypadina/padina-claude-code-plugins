name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate marketplace.json and every plugin.json
        run: |
          set -eu
          m=.claude-plugin/marketplace.json
          jq -e '(.name|type=="string") and (.owner.name|type=="string") and (.plugins|type=="array" and length>0)' "$m" >/dev/null \
            || { echo "::error::$m: need name, owner.name and a non-empty plugins array"; exit 1; }
          fail=0
          for n in $(jq -r '.plugins[].name' "$m"); do
            src=$(jq -r --arg n "$n" '.plugins[]|select(.name==$n)|.source' "$m")
            jq -e --arg n "$n" '.plugins[]|select(.name==$n)|(.source|type=="string") and (.description|type=="string" and length>0)' "$m" >/dev/null \
              || { echo "::error::marketplace entry $n: source and description required"; fail=1; }
            p="$src/.claude-plugin/plugin.json"
            [ -f "$p" ] || { echo "::error::$n: $p missing"; fail=1; continue; }
            jq -e --arg n "$n" '.name==$n and (.version|type=="string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+")) and (.description|type=="string" and length>0)' "$p" >/dev/null \
              || { echo "::error::$p: name must be $n, version semver, description non-empty"; fail=1; }
          done
          # every plugin directory must be listed in the marketplace
          for p in */.claude-plugin/plugin.json; do
            n=$(jq -r .name "$p")
            jq -e --arg n "$n" '.plugins|any(.name==$n)' "$m" >/dev/null || { echo "::error::$n ($p) not listed in $m"; fail=1; }
          done
          exit $fail
